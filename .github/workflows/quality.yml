name: Test and Lint
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dart
        uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate documentation
        run: npx --yes @docs.page/cli check
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dart
        uses: dart-lang/setup-dart@v1
      - uses: mirromutth/mysql-action@v1.1
        with:
          mysql version: '8.0'
          mysql database: 'boleiro'
          mysql user: 'admin'
          mysql password: '12345678'
      - name: Start PostgreSQL
        uses: harmon758/postgresql-action@v1.0.0
        with:
          postgresql version: '14'
          postgresql db: 'boleiro'
          postgresql user: 'admin'
          postgresql password: '12345678'
      - name: Install dependencies
        run: dart pub get
      - name: Test
        run: dart test
