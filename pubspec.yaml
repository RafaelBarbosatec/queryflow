version: 0.5.2
homepage: https://github.com/RafaelBarbosatec/queryflow

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  mysql_dart: ^1.0.0
  postgres: ^3.0.2
  

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  mocktail: ^1.0.4

