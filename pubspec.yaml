version: 0.8.0
homepage: https://github.com/RafaelBarbosatec/queryflow
repository: https://github.com/RafaelBarbosatec/queryflow
documentation: https://docs.page/RafaelBarbosatec/queryflow

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  mysql_dart: ^3.0.3
  postgres: ^3.0.2
  

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  mocktail: ^1.0.4

